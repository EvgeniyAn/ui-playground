<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radial share button</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main aria-label="Radial share button demo">
    <section class="share" data-state="idle" aria-label="Share a link">
      <div class="channels" id="channels" aria-label="Sharing channels" inert></div>
      <button class="trigger" aria-expanded="false" aria-controls="channels" aria-label="Share">
        <span class="label">SHARE</span>
        <svg class="close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
      </button>
      <p class="status" role="status" aria-live="polite"></p>
      <button class="replay" hidden>Replay</button>
    </section>
  </main>
</body>
</html>
