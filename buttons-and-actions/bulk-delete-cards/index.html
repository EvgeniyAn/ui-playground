<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk delete cards</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="demo basic" aria-labelledby="basic-title">
      <header><h1 id="basic-title">Basic delete UI</h1><button class="replay" type="button" aria-label="Replay basic demo">↻ Replay</button></header>
      <div class="panel">
        <div class="grid" aria-label="Basic folders"></div>
        <div class="empty" hidden><span class="empty-icon"></span><strong>All items deleted</strong><p>Your selected items have been moved to trash.</p></div>
        <button class="delete" type="button" disabled><span class="trash-icon"></span><span>Delete Selected</span></button>
      </div>
      <p class="status sr-only" role="status"></p>
    </section>
    <section class="demo premium" aria-labelledby="premium-title">
      <header><h2 id="premium-title">Premium delete UI</h2><button class="replay" type="button" aria-label="Replay premium demo">↻ Replay</button></header>
      <div class="panel">
        <div class="grid" aria-label="Premium folders"></div>
        <div class="empty" hidden><span class="empty-icon"></span><strong>All items deleted</strong><p>Your selected items have been moved to trash.</p></div>
        <div class="action-slot">
          <button class="delete" type="button" disabled>
            <span class="trash-circle"><span class="trash-icon"></span></span>
            <span class="delete-copy"><strong>Delete <b class="count">0</b> Items</strong><small>Move selected items to trash</small></span>
            <span class="progress" aria-hidden="true"><svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="17"/><circle class="meter" cx="20" cy="20" r="17" pathLength="100"/></svg><b>0%</b></span>
          </button>
        </div>
      </div>
      <p class="status sr-only" role="status"></p>
    </section>
    <p class="hint">Select cards to try it out. <kbd>Esc</kbd> cancels an animation.</p>
  </main>
</body>
</html>
