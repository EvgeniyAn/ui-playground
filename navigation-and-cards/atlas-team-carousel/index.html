<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7e4dc">
  <title>ATLAS — Our Team</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="team" aria-labelledby="team-title">
    <header class="masthead">
      <span class="wordmark">ATLAS<span>°</span></span>
      <button class="replay" type="button">Replay <span aria-hidden="true">↻</span></button>
    </header>
    <div class="heading">
      <p>ATLAS STUDIO · <span>07</span> PEOPLE</p>
      <h1 id="team-title">Our Team</h1>
    </div>
    <section class="deck" aria-label="Team portraits" aria-roledescription="carousel" tabindex="0">
      <div class="cards"></div>
    </section>
    <footer class="controls">
      <p class="counter" aria-hidden="true"><span class="current">01</span> / 07</p>
      <div class="navigation">
        <button class="arrow previous" type="button" aria-label="Previous person"><span></span></button>
        <div class="pagination" aria-label="Choose a person"></div>
        <button class="arrow next" type="button" aria-label="Next person"><span></span></button>
      </div>
      <p class="hint">DRAG · SCROLL · ARROWS</p>
      <p class="sr-only status" role="status" aria-live="polite"></p>
    </footer>
    <noscript>Enable JavaScript to explore the team carousel.</noscript>
  </main>
</body>
</html>
