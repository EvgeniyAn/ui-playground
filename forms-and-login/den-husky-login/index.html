<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Den — Your husky’s keeping watch</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body>
<main class="scene">
<section class="card" aria-labelledby="title">
<svg class="husky" viewBox="0 0 180 230" aria-hidden="true">
<defs>
 <linearGradient id="fur" x2=".7" y2="1"><stop stop-color="#59647d"/><stop offset="1" stop-color="#262e40"/></linearGradient>
 <radialGradient id="white"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7eef9"/></radialGradient>
 <radialGradient id="shine"><stop stop-color="#bdc6d9" stop-opacity=".65"/><stop offset="1" stop-color="#8c9ab5" stop-opacity="0"/></radialGradient>
 <linearGradient id="iris" x2="0" y2="1"><stop stop-color="#bcf0ff"/><stop offset="1" stop-color="#1676b8"/></linearGradient>
</defs>
<g class="dog-body"><ellipse cx="90" cy="192" rx="47" ry="34" fill="url(#fur)"/><path d="M83 162 Q64 184 77 217 Q90 224 104 217 Q116 184 97 162" fill="url(#white)"/></g>
<g class="dog-head">
<path d="M35 68 Q24 48 28 11 Q30 -2 65 46 M118 46 Q151 -3 151 12 Q153 40 141 66" fill="url(#fur)"/>
<path d="M38 53 34 24 54 48 M127 48 145 23 140 55" fill="#c7d2e8"/>
<ellipse cx="90" cy="105" rx="76" ry="68" fill="url(#white)"/>
<path d="M14 97 Q12 41 77 39 Q91 37 108 40 Q165 43 166 97 Q145 87 128 90 Q103 92 90 69 Q74 92 57 88 Q37 87 14 97" fill="url(#fur)"/>
<ellipse cx="65" cy="68" rx="49" ry="28" fill="url(#shine)"/>
<ellipse cx="60" cy="82" rx="7" ry="4.5" transform="rotate(-20 60 82)" fill="#b7c2d7"/><ellipse cx="120" cy="82" rx="7" ry="4.5" transform="rotate(20 120 82)" fill="#b7c2d7"/>
<g class="eyes"><g class="eye"><ellipse cx="62" cy="103" rx="11" ry="12" fill="white"/><ellipse cx="62" cy="105" rx="9.5" ry="10" fill="url(#iris)"/><g class="pupil"><ellipse cx="63" cy="106" rx="5.8" ry="7" fill="#142d43"/><circle cx="66" cy="101" r="3.8" fill="white"/><circle cx="59" cy="109" r="1.6" fill="white"/></g></g><g class="eye"><ellipse cx="118" cy="103" rx="11" ry="12" fill="white"/><ellipse cx="118" cy="105" rx="9.5" ry="10" fill="url(#iris)"/><g class="pupil"><ellipse cx="119" cy="106" rx="5.8" ry="7" fill="#142d43"/><circle cx="122" cy="101" r="3.8" fill="white"/><circle cx="115" cy="109" r="1.6" fill="white"/></g></g></g>
<g class="happy-eyes" fill="none" stroke="#27354a" stroke-width="3" stroke-linecap="round"><path d="M54 105q8-9 16 0 M110 105q8-9 16 0"/></g>
<ellipse cx="44" cy="127" rx="12" ry="6.5" fill="#f6c7ae" opacity=".8"/><ellipse cx="136" cy="127" rx="12" ry="6.5" fill="#f6c7ae" opacity=".8"/>
<ellipse cx="90" cy="133" rx="33" ry="24" fill="#dce5ef"/><ellipse cx="90" cy="129" rx="31" ry="22" fill="url(#white)"/>
<g fill="#bac9da"><circle cx="64" cy="129" r="1"/><circle cx="65" cy="135" r="1"/><circle cx="69" cy="141" r="1"/><circle cx="116" cy="129" r="1"/><circle cx="115" cy="135" r="1"/><circle cx="111" cy="141" r="1"/></g>
<ellipse cx="90" cy="119" rx="12.5" ry="8" fill="#1d242c"/><path d="M90 126v9q-7 8-17 3m17-3q7 8 17 3" stroke="#242b34" stroke-width="2.2" stroke-linecap="round" fill="none"/>
</g>
<g class="paw paw-left"><ellipse cx="62" cy="184" rx="21" ry="23" fill="url(#fur)"/><g fill="#b9c5df"><ellipse cx="62" cy="187" rx="9.5" ry="7.5"/><ellipse cx="50" cy="172" rx="4" ry="5" transform="rotate(18 50 172)"/><ellipse cx="62" cy="168" rx="4" ry="5.5"/><ellipse cx="74" cy="172" rx="4" ry="5" transform="rotate(-18 74 172)"/></g></g>
<g class="paw paw-right"><ellipse cx="118" cy="184" rx="21" ry="23" fill="url(#fur)"/><g fill="#b9c5df"><ellipse cx="118" cy="187" rx="9.5" ry="7.5"/><ellipse cx="106" cy="172" rx="4" ry="5" transform="rotate(18 106 172)"/><ellipse cx="118" cy="168" rx="4" ry="5.5"/><ellipse cx="130" cy="172" rx="4" ry="5" transform="rotate(-18 130 172)"/></g></g>
</svg>
<h1 id="title">Den</h1><p class="intro">Welcome back. Your husky’s keeping watch.</p>
<form autocomplete="off">
 <div class="field"><input id="username" name="username" type="text" placeholder=" " required spellcheck="false"><label for="username">Username</label></div>
 <div class="field password-field"><input id="password" name="password" type="password" placeholder=" " required><label for="password">Password</label><button type="button" class="reveal" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="m4 3 16 18"/></svg></button></div>
 <div class="options"><label class="remember"><input type="checkbox">Remember me</label><button type="button" class="text-button" data-info="Password recovery is not connected in this demo.">Forgot password?</button></div>
 <button class="sign-in" type="submit"><span>Sign in</span><span class="door-scene" aria-hidden="true"><span class="door-frame"><span class="door-glow"></span><span class="door-panel"></span></span><svg class="person" viewBox="0 0 18 36"><circle cx="9" cy="4" r="2.6"/><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 7v12m0-10-3 9m3-9 3 8"/><path class="leg front" d="m9 19-3 14"/><path class="leg back" d="m9 19 3 14"/></g></svg></span></button>
 <p class="status" role="status" aria-live="polite"></p>
</form>
<div class="divider"><span>or continue with</span></div>
<div class="social"><button type="button" data-info="Google sign-in is not connected in this demo."><span class="google" aria-hidden="true">G</span>Google</button><button type="button" data-info="Apple sign-in is not connected in this demo."><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16.5 3c-1.2.1-2.7.8-3.5 1.8-.7.9-1.3 2.2-1.1 3.4 1.4.1 2.7-.7 3.5-1.7.8-1 1.3-2.3 1.1-3.5ZM19 15.6c-.1-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.7-2-1.6-.1-3.1.9-3.9.9-.8 0-2-1-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.2 10 .8 1.1 1.7 2.2 2.9 2.1 1.2 0 1.6-.7 3.1-.7 1.4 0 1.8.7 3.1.7 1.3 0 2.1-1.1 2.9-2.2.9-1.3 1.3-2.6 1.4-2.7-.1 0-2.6-1-2.6-4Z" transform="translate(0 -2) scale(.95)"/></svg>Apple</button></div>
<p class="signup">New to Den? <button class="text-button" data-info="Account creation is not connected in this demo.">Create account</button></p>
</section>
<button type="button" class="replay" aria-label="Replay animation">↻ Replay</button>
</main>
</body></html>
